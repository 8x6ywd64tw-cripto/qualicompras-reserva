<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>QualiCompras - Central de Compras Qualities</title>
    <meta name="description" content="Sistema de gestão de compras inteligente da Qualities Refeições - Grupo Comenda. Cotações, fornecedores, pedidos e controle de custos." />
    <meta name="keywords" content="gestão de compras, cotação de fornecedores, alimentação industrial, controle de custos, procurement, compras corporativas" />
    <meta name="theme-color" content="#25346D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QualiCompras" />
    <meta name="application-name" content="QualiCompras" />
    <meta name="msapplication-TileColor" content="#25346D" />
    <meta name="msapplication-navbutton-color" content="#25346D" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Auth bootstrap: handles token from URL hash AND forces PWA cache update -->
    <script>
      (function() {
        try {
          // Read token from URL hash (set by Login after successful auth)
          var h = window.location.hash;
          if (h && h.indexOf('#token=') === 0) {
            var t = decodeURIComponent(h.substring(7));
            if (t && t.length > 10) {
              localStorage.setItem('manus-auth-token', t);
              sessionStorage.setItem('manus-cookie', 'app_session_id=' + t);
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
